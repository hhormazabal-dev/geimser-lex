<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PJUD Companion</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 12px; width: 320px; }
      .title { font-weight: 700; margin: 0 0 8px; }
      .muted { color: #666; font-size: 12px; margin: 0 0 12px; }
      button { width: 100%; border: 1px solid #ddd; background: #111827; color: white; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
      button[disabled] { opacity: 0.6; cursor: not-allowed; }
      .status { margin-top: 10px; font-size: 12px; }
      .ok { color: #065f46; }
      .err { color: #991b1b; }
      .hint { margin-top: 10px; font-size: 12px; color: #374151; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; }
    </style>
  </head>
  <body>
    <p class="title">PJUD Companion</p>
    <p class="muted">Conecta esta extensión a la pestaña actual de la plataforma para habilitar la consulta PJUD.</p>

    <button id="connect">Conectar a esta pestaña</button>
    <div id="status" class="status"></div>

    <p class="hint">
      Tip: abre <code>/pjud</code> en la plataforma y luego presiona “Conectar”.
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
